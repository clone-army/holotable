{% extends 'base.html' %}
{% block title %}Editor - Holotable{% endblock %}
{% block bodyclass %}editor-page{% endblock %}
{% block topbar %}
<div class="editor-title">
  <input id="scn-name" class="title-input" maxlength="60" aria-label="Scenario name">
  <code id="scn-map" class="map-chip"></code>
  <button id="checks-chip" class="chip" type="button" title="Things to fix before it runs well"></button>
  <span id="save-state" class="muted small"></span>
  <button id="undo-btn" class="btn icon-btn" type="button" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
  <button id="redo-btn" class="btn icon-btn" type="button" title="Redo (Ctrl+Y)" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button id="clone-btn" class="btn" type="button" title="Make a copy of this scenario and open it (saves your changes first)">Clone</button>
  <button id="save-btn" class="btn primary" type="button">Save</button>
</div>
{% endblock %}
{% block content %}
<main class="editor">
  <aside class="toolbar" aria-label="Tools">
    <button class="tool active" data-tool="select" title="Select / move (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg><span>Select</span></button>
    <button class="tool" data-tool="point" title="Point: click to place, drag to face (P)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 12l7-7"/></svg><span>Point</span></button>
    <button class="tool" data-tool="route" title="Route: click to add points, Enter or double-click to finish (R)"><svg viewBox="0 0 24 24"><path d="M4 18l6-8 5 5 5-9"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="6" r="2"/></svg><span>Route</span></button>
    <button class="tool" data-tool="area" title="Area: click the middle, drag out the size (A)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 2"/><circle cx="12" cy="12" r="1.5"/></svg><span>Area</span></button>
    <div class="tool-sep"></div>
    <button class="tool" id="fit-btn" title="Fit the map (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Fit</span></button>
  </aside>

  <section class="map-wrap">
    <canvas id="map" tabindex="0"></canvas>
    <div class="cut-panel">
      <label for="cut">Cut height <span id="cut-val"></span></label>
      <input id="cut" type="range" min="0" max="1" step="8">
      <div id="levels" class="levels"></div>
      <label class="check"><input id="show-labels" type="checkbox" checked> Names</label>
      <div class="ent-head">Map entities</div>
      <div id="ent-kinds" class="ent-kinds"></div>
    </div>
    <div id="hud" class="hud"></div>
    <div id="loading" class="loading">Reading the map...</div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="scenario">Scenario</button>
      <button class="tab" data-tab="places">Places</button>
      <button class="tab" data-tab="npcs">NPCs</button>
      <button class="tab" data-tab="groups">Groups</button>
      <button class="tab" data-tab="triggers">Triggers</button>
      <button class="tab" data-tab="checks">Checks</button>
    </div>
    <div class="tab-body" id="tab-scenario"></div>
    <div class="tab-body" id="tab-places" hidden></div>
    <div class="tab-body" id="tab-npcs" hidden></div>
    <div class="tab-body" id="tab-groups" hidden></div>
    <div class="tab-body" id="tab-triggers" hidden></div>
    <div class="tab-body" id="tab-checks" hidden></div>
  </aside>
</main>
<datalist id="npc-list"></datalist>
<datalist id="model-list"></datalist>
<audio id="preview" preload="none"></audio>
{% endblock %}
{% block scripts %}
<script>const SCENARIO_ID = {{ sid|tojson }};</script>
<script src="{{ url_for('static', filename='editor.js') }}?v={{ version }}"></script>
{% endblock %}
